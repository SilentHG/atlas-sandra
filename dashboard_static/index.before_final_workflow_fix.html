<style>
:root{--bg:#0a0a0f;--card:rgba(255,255,255,.035);--border:rgba(255,255,255,.08);--green:#00ff88;--red:#ff3366;--amber:#ffaa00;--blue:#00aaff;--muted:#8c92a3;--text:#f4f7fb}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,sans-serif;background:radial-gradient(circle at 15% 5%,rgba(0,255,136,.09),transparent 28%),radial-gradient(circle at 85% 20%,rgba(0,170,255,.08),transparent 30%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),var(--bg);background-size:auto,auto,36px 36px,36px 36px}.mono{font-family:"JetBrains Mono",monospace}.shell{display:grid;grid-template-columns:240px 1fr 330px;min-height:100vh}aside{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--border);background:rgba(10,10,15,.78);backdrop-filter:blur(18px)}main{padding:18px 22px;min-width:0}.right{position:sticky;top:0;height:100vh;padding:18px 16px;border-left:1px solid var(--border);background:rgba(10,10,15,.68);overflow:auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,rgba(0,255,136,.24),rgba(0,170,255,.16));border:1px solid rgba(0,255,136,.25);display:grid;place-items:center}h1{font-size:18px;letter-spacing:.1em;margin:0}.brand small{color:var(--muted)}.dot,.pulse{width:8px;height:8px;border-radius:99px;background:currentColor;display:inline-block;box-shadow:0 0 16px currentColor;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.84)}}nav{display:grid;gap:7px}.nav{border:0;background:transparent;color:#aeb6c7;display:flex;gap:11px;align-items:center;padding:12px;border-radius:14px;cursor:pointer;font-weight:700;text-align:left}.nav:hover,.nav.active{color:white;background:rgba(255,255,255,.065);box-shadow:inset 0 0 0 1px var(--border)}.sidefoot{position:absolute;bottom:18px;left:16px;right:16px;padding:14px;border:1px solid var(--border);border-radius:18px;background:var(--card);color:var(--muted);font-size:12px}.sidefoot div{display:flex;justify-content:space-between;margin:6px 0}header{height:74px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:22px;background:var(--card);backdrop-filter:blur(18px);padding:0 18px;margin-bottom:18px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:rgba(255,255,255,.045);padding:8px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#cbd5e1}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.pnl{font:800 22px "JetBrains Mono"}.title{display:flex;justify-content:space-between;align-items:end;margin:12px 0 18px}.title h2{font-size:30px;line-height:1;margin:0}.title p,.sub{color:var(--muted);font-size:12px}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{border:1px solid var(--border);border-radius:22px;background:var(--card);backdrop-filter:blur(18px);padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.25);position:relative;overflow:hidden}.card h3{margin:0 0 12px;font-size:14px}.metric{font:800 30px "JetBrains Mono";letter-spacing:-.04em}.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:999px;padding:7px 9px;font-size:12px;color:#d7deea;background:rgba(255,255,255,.04);margin:3px}.btn{border:1px solid var(--border);background:rgba(255,255,255,.06);color:white;border-radius:13px;padding:10px 12px;font-weight:800;cursor:pointer}.btn:hover{transform:translateY(-1px)}.btn.green{background:rgba(0,255,136,.10);border-color:rgba(0,255,136,.30)}.btn.red{background:rgba(255,51,102,.10);border-color:rgba(255,51,102,.30)}.btn.blue{background:rgba(0,170,255,.10);border-color:rgba(0,170,255,.30)}.btn.amber{background:rgba(255,170,0,.10);border-color:rgba(255,170,0,.30)}input,select{width:100%;background:rgba(255,255,255,.055);border:1px solid var(--border);color:white;border-radius:14px;padding:11px 12px}option{background:#111827}label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:7px;display:block}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;text-align:left}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.empty{padding:18px;border:1px dashed var(--border);border-radius:16px;color:var(--muted)}.code{white-space:pre-wrap;font:12px "JetBrains Mono";background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:16px;padding:14px;max-height:260px;overflow:auto}.alert{padding:13px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.04);margin-bottom:10px}.toastwrap{position:fixed;right:18px;bottom:18px;z-index:99;display:grid;gap:10px}.toast{padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:#101018;box-shadow:0 20px 50px rgba(0,0,0,.35);font-size:13px}canvas{width:100%!important;max-height:320px}@media(max-width:1300px){.shell{grid-template-columns:84px 1fr}.right{display:none}.brand h1,.brand small,.nav span,.sidefoot{display:none}.nav{justify-content:center}}@media(max-width:900px){.shell{display:block}.kpis,.two,.three,.form{grid-template-columns:1fr}aside{position:relative;height:auto}.nav span,.brand h1,.brand small{display:inline}.nav{justify-content:flex-start}}
</style>

<body>
<div class="shell"><aside><div class="brand"><div class="logo"><i data-lucide="activity"></i></div><div><h1>ATLAS</h1><small><span class="pulse green"></span> Trading OS</small></div></div><nav id="nav"></nav><div class="sidefoot"><div><span>Uptime</span><span id="uptime">00:00:00</span></div><div><span>Version</span><span>v1.0.0</span></div></div></aside><main><header><div class="head"><span id="market" class="pill"><span class="dot"></span> MARKET</span><span id="utc" class="pill mono"></span><span id="et" class="pill mono"></span></div><div class="head"><span id="pnl" class="pnl green">$0.00 ↑</span><span id="kill" class="pill green"><span class="dot"></span> DISARMED</span><span class="pill"><i data-lucide="bell"></i><span id="alertCount">0</span></span><span id="lastRefresh" class="pill mono">refresh --</span></div></header><section id="content"></section></main><section class="right"><h3>Live Alerts & Signals</h3><div id="alerts"></div></section></div><div class="toastwrap" id="toasts"></div>
<script>
const API=location.origin.includes("47.130.131.155")?"http://47.130.131.155:8080":"http://localhost:8080";const state={page:"overview",boot:Date.now(),health:null,risk:null,agents:[],strategies:[],portfolio:null,livePortfolio:null,orders:[],marketStatus:null,lastBacktest:null,alerts:[],signals:[],marketBars:[],selectedSymbol:"AAPL",charts:{}};const nav=[["overview","Overview","layout-grid"],["live","Live Trading","chart-line"],["strategies","Strategies","brain"],["backtesting","Backtesting","history"],["risk","Risk & Kill Switch","shield"],["agents","Agents","bot"],["scout","Scout Network","radar"],["brief","Intelligence Brief","newspaper"],["settings","Settings","settings"]];const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:2}),cls=n=>Number(n||0)>=0?"green":"red";function api(p,o={}){return fetch(API+p,{headers:{"Content-Type":"application/json"},...o}).then(async r=>{let t=await r.text(),d={};try{d=t?JSON.parse(t):{}}catch{d={raw:t}}if(!r.ok)throw Error(d.detail||d.message||t||r.statusText);return d})}function toast(m,t="blue"){let e=document.createElement("div");e.className="toast";e.innerHTML=`<b class="${t}">${t.toUpperCase()}</b><br>${m}`;$("toasts").appendChild(e);setTimeout(()=>e.remove(),4200)}function empty(m){return`<div class="empty">${m}</div>`}function ago(ts){if(!ts)return"never";let s=Math.floor((Date.now()-new Date(ts))/1000);return s<60?`${s}s ago`:s<3600?`${Math.floor(s/60)}m ago`:`${Math.floor(s/3600)}h ago`}function init(){$("nav").innerHTML=nav.map(([id,l,i])=>`<button class="nav ${id=="overview"?"active":""}" onclick="page('${id}')" data-page="${id}"><i data-lucide="${i}"></i><span>${l}</span></button>`).join("");lucide.createIcons();renderAlerts();refresh(true);setInterval(()=>refresh(true),10000);setInterval(clock,1000)}function page(p){state.page=p;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page==p));render()}function clock(){let n=new Date(),s=Math.floor((Date.now()-state.boot)/1000);$("utc").textContent="UTC "+n.toISOString().slice(11,19);$("et").textContent="ET "+n.toLocaleTimeString("en-US",{timeZone:"America/New_York",hour12:false});$("uptime").textContent=new Date(s*1000).toISOString().slice(11,19)}async function refresh(silent=false){await Promise.allSettled([api("/health").then(d=>state.health=d),api("/api/risk/status").then(d=>state.risk=d),api("/api/agents/sync-processes",{method:"POST"}).catch(()=>null).then(()=>api("/api/agents/registry")).then(d=>state.agents=Array.isArray(d)?d:[]),api("/api/strategies").then(d=>state.strategies=Array.isArray(d)?d:(d.strategies||[])),api("/api/portfolio/summary").then(d=>state.portfolio=d).catch(()=>state.portfolio={portfolio_value:100000,daily_pnl:0,positions:[]}),
api("/api/dashboard/portfolio-live").then(d=>{state.livePortfolio=d;state.portfolio=d}).catch(()=>null),
api("/api/dashboard/orders-live").then(d=>state.orders=Array.isArray(d)?d:[]).catch(()=>state.orders=[]),
api("/api/dashboard/alerts-live").then(d=>state.alerts=Array.isArray(d)?d:[]).catch(()=>state.alerts=[]),
api("/api/dashboard/market-status").then(d=>state.marketStatus=d).catch(()=>null),
api("/api/dashboard/recent-signals?limit=8").then(d=>state.signals=Array.isArray(d)?d:[]).catch(()=>state.signals=[]),
api("/api/dashboard/market-bars?symbol="+encodeURIComponent(state.selectedSymbol)+"&limit=80").then(d=>state.marketBars=d.bars||[]).catch(()=>state.marketBars=[])
]);header();renderAlerts();render();if(!silent)toast("Dashboard refreshed","green")}function header(){let k=state.health?.services?.kill_switch||"unknown",armed=String(k).toLowerCase().includes("armed")&&!String(k).toLowerCase().includes("disarmed");$("kill").className=`pill ${armed?"red":"green"}`;$("kill").innerHTML=`<span class="dot"></span> ${armed?"ARMED":"DISARMED"}`;$("lastRefresh").textContent="refresh "+new Date().toLocaleTimeString();let open=state.marketStatus?state.marketStatus.is_open:marketOpen();$("market").className=`pill ${open?"green":"red"}`;$("market").innerHTML=`<span class="dot"></span> ${state.marketStatus?.label|| (open?"MARKET OPEN":"MARKET CLOSED")}`;let pnl=state.portfolio?.daily_pnl||0;$("pnl").className=`pnl ${cls(pnl)}`;$("pnl").textContent=`${money(pnl)} ${pnl>=0?"↑":"↓"}`}function marketOpen(){let e=new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"})),d=e.getDay(),m=e.getHours()*60+e.getMinutes();return d>0&&d<6&&m>=570&&m<=960}function title(t,s){return`<div class="title"><div><h2>${t}</h2><p>${s}</p></div><button class="btn blue" onclick="refresh()">Refresh All</button></div>`}function card(t,b){return`<div class="card"><h3>${t}</h3>${b}</div>`}function render(){let c=$("content");if(state.page=="overview")c.innerHTML=overview();if(state.page=="live")c.innerHTML=live();if(state.page=="strategies")c.innerHTML=strategies();if(state.page=="backtesting")c.innerHTML=backtesting();if(state.page=="risk")c.innerHTML=risk();if(state.page=="agents")c.innerHTML=agents();if(state.page=="scout")c.innerHTML=scout();if(state.page=="brief")c.innerHTML=brief();if(state.page=="settings")c.innerHTML=settings();lucide.createIcons();charts()}function overview(){let h=state.health?.services||{},r=state.risk||{},a=state.strategies||[],active=a.filter(x=>(x.status||"").toLowerCase()=="active").length,score=h.timescaledb=="ok"&&h.feature_store?.status=="ok"&&h.last_data_timestamp?.status=="ok"?96:72;return title("Overview","Live ATLAS command center with 10-second auto-refresh")+`<div class="grid kpis">${card("Total Portfolio Value",`<div class="metric">${money(state.livePortfolio?.account?.portfolio_value||state.portfolio?.portfolio_value||0)}</div><canvas id="spark"></canvas><p class="sub">Buying Power: ${money(state.livePortfolio?.account?.buying_power||0)}</p>`) }${card("Daily PnL",`<div class="metric ${cls(state.livePortfolio?.daily_pnl||state.portfolio?.daily_pnl)}">${money(state.livePortfolio?.daily_pnl||state.portfolio?.daily_pnl||0)}</div><p class="sub">Open Positions: ${state.livePortfolio?.open_count||0}</p>`) }${card("Active Strategies",`<div class="metric blue">${active}/${a.length}</div><p class="sub">Database strategy status</p>`)}${card("System Health",`<div class="metric green">${score}%</div><div style="height:10px;background:rgba(255,255,255,.08);border-radius:99px"><div style="height:10px;width:${score}%;background:var(--green);border-radius:99px"></div></div>`)}</div><br><div class="grid two">${card("Portfolio Equity Curve",`<canvas id="equity"></canvas>`)}${card("Asset Distribution",`<canvas id="assets"></canvas>`)}</div><br><div class="grid three">${card("Polygon Feed",`<div class="metric ${h.last_data_timestamp?.status=="ok"?"green":"amber"}">${h.last_data_timestamp?.status||"unknown"}</div><p class="sub">Last: ${h.last_data_timestamp?.timestamp||"--"} | Age: ${h.last_data_timestamp?.age_seconds??"--"}s</p>${["AAPL","MSFT","NVDA","TSLA","AMZN"].map(s=>`<span class="chip green"><span class="dot"></span>${s}</span>`).join("")}`)}${card("Binance Feed",`<div class="metric green">LIVE</div>${["BTC/USDT","ETH/USDT","SOL/USDT"].map(s=>`<span class="chip green"><span class="dot"></span>${s}</span>`).join("")}`)}${card("Feature Store",`<div class="metric ${h.feature_store?.status=="ok"?"green":"red"}">${h.feature_store?.status||"unknown"}</div><p class="sub">${h.feature_store?.last_computed||"--"}</p>`)}</div><br><div class="grid three">${card("Active Agents",agentMini())}${card("Recent Signals",recentSignals())}${card("Kill Switch",`<div class="metric ${r.kill_switch_armed?"red":"green"}">${r.kill_switch_armed?"ARMED":"DISARMED"}</div><p class="sub">${r.reason||"No active reason"}</p>`)}</div>`}function agentMini(){return(state.agents||[]).slice(0,6).map(a=>`<span class="chip ${a.status=="running"?"green":a.status=="error"?"red":"blue"}"><span class="dot"></span>${a.name}: ${a.status} · ${ago(a.last_heartbeat)}</span>`).join("")||empty("No agents returned")}function recentSignals(){let rows=state.signals||[];if(!rows.length)return empty("No recent hypotheses/signals yet");return rows.slice(0,5).map(x=>`<div class="signal"><b>${(x.source||"signal").toUpperCase()}</b><p>${String(x.description||"").slice(0,120)}...</p><small>Confidence ${((Number(x.confidence)||0)*100).toFixed(0)}% · ${ago(x.created_at)}</small></div>`).join("")}function live(){return title("Live Trading","Paper execution and positions monitor")+`<div class="grid two">${card("Live Price Chart / Paper Trade",`<div class="form"><div><label>Symbol</label><select id="tradeSymbol" onchange="changeTradeSymbol(this.value)">${["AAPL","MSFT","NVDA","TSLA","AMZN","BTC/USDT","ETH/USDT","SOL/USDT"].map(s=>`<option ${state.selectedSymbol==s?"selected":""}>${s}</option>`)}</select></div><div><label>Side</label><select id="tradeSide"><option>buy</option><option>sell</option></select></div><div><label>Qty</label><input id="tradeQty" value="1"></div><button class="btn green" onclick="paperTrade()">Paper Trade</button></div><canvas id="priceChart"></canvas><p class="sub">PAPER TRADING</p>`)}${card("Recent Order Response",`<div id="orderResult">${orderHistory()}</div>`)}</div><br>${card("Positions",`<table class="table"><thead><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th>Current</th><th>PnL</th><th>Status</th></tr></thead><tbody>${(state.livePortfolio?.positions||state.portfolio?.positions||[]).map(p=>`<tr><td>${p.symbol}</td><td>${p.side||"--"}</td><td>${p.qty||p.quantity||"--"}</td><td>${money(p.avg_entry_price||p.entry_price||0)}</td><td>${money(p.current_price||0)}</td><td class="${cls(p.unrealized_pnl)}">${money(p.unrealized_pnl)}</td><td>${p.status||"open"}</td></tr>`).join("")||`<tr><td colspan="7">${empty("No open positions")}</td></tr>`}</tbody></table>`)}`}function orderHistory(){let rows=state.orders||[];if(!rows.length)return empty("No recent orders");return `<table class="table"><tbody>${rows.slice(0,5).map(o=>`<tr><td>${o.symbol}</td><td>${o.side}</td><td>${o.quantity||o.qty}</td><td><span class="chip blue">${o.status}</span></td></tr>`).join("")}</tbody></table>`}async function paperTrade(){let symbol=$("tradeSymbol").value;state.selectedSymbol=symbol;let broker=symbol.includes("/USDT")?"binance_testnet":"alpaca";try{let d=await api("/api/execution/test-order",{method:"POST",body:JSON.stringify({broker,symbol,side:$("tradeSide").value,qty:Number($("tradeQty").value||1),order_type:"market",test_only:true})});$("orderResult").innerHTML=`<div class="code">${JSON.stringify(d,null,2)}</div>`;toast("Paper trade executed","green");await refresh(true);state.selectedSymbol=symbol;page("live")}catch(e){$("orderResult").innerHTML=`<div class="code red">${e.message}</div>`;toast(e.message,"red")}}function changeTradeSymbol(v){state.selectedSymbol=v;api("/api/dashboard/market-bars?symbol="+encodeURIComponent(v)+"&limit=80").then(d=>{state.marketBars=d.bars||[];charts()}).catch(e=>toast(e.message,"red"))}function strategies(){let a=state.strategies||[];let useful=a.filter(x=>["active","backtesting","failed","pending"].includes(String(x.status||"").toLowerCase())).slice(0,30);return title("Strategies","Generate, review and manage useful active strategies")+card("Generate Strategy",`<div class="form"><div><label>Asset Class</label><select id="genAsset" onchange="updateStrategySymbols()"><option value="us_equities">US Equities</option><option value="crypto">Crypto</option></select></div><div><label>Symbol</label><select id="genSymbol"><option>AAPL</option><option>MSFT</option><option>NVDA</option><option>TSLA</option><option>AMZN</option></select></div><div><label>Style</label><select id="genStyle"><option value="momentum">Momentum</option><option value="mean_reversion">Mean Reversion</option><option value="breakout">Breakout</option><option value="trend">Trend</option><option value="scalping">Scalping</option></select></div><div><label>Timeframe</label><select id="genTimeframe"><option value="1m">1m</option><option value="5m">5m</option><option value="15m">15m</option><option value="1h" selected>1h</option><option value="1d">1d</option></select></div><button class="btn green" onclick="genStrat()">Generate Strategy</button></div><div id="genResult"></div>`)+`<br><div class="grid three">${useful.map(s=>card(s.name||s.id||"Strategy",`<span class="chip ${s.status=="active"?"green":s.status=="failed"?"red":"blue"}">${s.status||"unknown"}</span><p class="sub">${Array.isArray(s.symbols)?s.symbols.join(", "):(s.symbols||"multi-symbol")}</p><p>${String(s.description||"").slice(0,120)}...</p><button class="btn blue" onclick="runBacktest('${s.id||""}','${Array.isArray(s.symbols)&&s.symbols[0]?s.symbols[0]:"AAPL"}')">Backtest</button>`)).join("")||empty("No useful active strategies returned")}</div>`}

function updateStrategySymbols(){let asset=$("genAsset")?.value||"us_equities";let symbols=asset=="crypto"?["BTC/USDT","ETH/USDT","SOL/USDT"]:["AAPL","MSFT","NVDA","TSLA","AMZN"];if($("genSymbol"))$("genSymbol").innerHTML=symbols.map(x=>`<option>${x}</option>`).join("")}

async function genStrat(){try{let asset=$("genAsset").value,symbol=$("genSymbol").value,style=$("genStyle").value,timeframe=$("genTimeframe").value;$("genResult").innerHTML=`<br><p class="sub">Generating ${asset} ${style} strategy for ${symbol}. This may take 1-2 minutes...</p>`;let d=await api("/api/strategies/generate",{method:"POST",body:JSON.stringify({asset_class:asset,symbols:[symbol],timeframe,style,lookback_days:180})});$("genResult").innerHTML=`<br><div class="code">${JSON.stringify(d,null,2)}</div>`;toast("Strategy generated and coded","green");await refresh(true)}catch(e){$("genResult").innerHTML=`<p class="red">${e.message}</p>`;toast(e.message,"red")}}function backtesting(){return title("Backtesting","2-year history, daily equity, 70/30 split, Monte Carlo")+card("Run Backtest",`<div class="form"><div><label>Symbol</label><select id="btSymbol">${["AAPL","MSFT","NVDA","TSLA","AMZN"].map(s=>`<option>${s}</option>`)}</select></div><div><label>Qty</label><input id="btQty" value="10"></div><div><label>Split</label><span class="chip green">70% Backtest / 30% Monte Carlo</span></div><button class="btn green" onclick="runBacktest('',document.getElementById('btSymbol').value)">Run</button></div>`)+`<br><div id="btResult">${state.lastBacktest?btResult(state.lastBacktest):empty("Run a backtest")}</div>`}async function runBacktest(id="",symbol="AAPL"){state.page="backtesting";render();$("btResult").innerHTML=card("Running","<p class='sub'>Backtest in progress...</p>");try{let d=await api("/api/backtest/run",{method:"POST",body:JSON.stringify({strategy_id:id,symbol,qty:Number($("btQty")?.value||10)})});state.lastBacktest=d;render();toast("Backtest completed","green")}catch(e){$("btResult").innerHTML=card("Error",`<p class="red">${e.message}</p>`)}}function btResult(d){let bt=d.results?.backtest||{},mc=d.results?.monte_carlo||{},m=mc.parameters?.monte_carlo||{};return`<div class="grid two">${card("Equity Curve",`<canvas id="btChart"></canvas><p class="sub">Daily equity points: ${(bt.equity_curve||[]).length} / ${(mc.equity_curve||[]).length}</p>`)}${card("Monte Carlo",`<div class="metric ${m.status=="pass"?"green":"amber"}">${m.status||"unknown"}</div><p class="sub">Runs: ${m.runs||"--"} | Points: ${m.daily_points||"--"}</p><div class="code">${JSON.stringify(m,null,2)}</div>`)}</div><br><div class="grid three">${card("Sharpe",`<div class="metric ${Number(bt.sharpe_ratio)>1?"green":Number(bt.sharpe_ratio)<0?"red":"amber"}">${Number(bt.sharpe_ratio||0).toFixed(2)}</div>`)}${card("Max Drawdown",`<div class="metric red">${(Number(bt.max_drawdown||0)*100).toFixed(2)}%</div>`)}${card("Trades",`<div class="metric blue">${bt.total_trades||0}</div>`)}</div>`}function risk(){let r=state.risk||{},armed=r.kill_switch_armed,cap=Number(r.capital||100000),d=Number(r.daily_loss_usd||0),w=Number(r.weekly_loss_usd||0);return title("Risk & Kill Switch","Confirmed execution blocking when armed")+`<div class="card" style="text-align:center;padding:34px"><div class="metric ${armed?"red":"green"}" style="font-size:54px">${armed?"ARMED":"DISARMED"}</div><p class="sub">${r.reason||"Trading allowed"}</p><button class="btn red" onclick="ks('arm')">ARM</button> <button class="btn green" onclick="ks('disarm')">DISARM</button></div><br><div class="grid two">${meter("Daily Loss",d,cap*.02)}${meter("Weekly Loss",w,cap*.04)}</div><br>${card("Simulate PnL",`<div class="form"><div><label>Loss</label><input id="loss" value="2500"></div><button class="btn amber" onclick="sim()">Fire Simulation</button></div><div id="simResult"></div>`)}`}function meter(t,v,l){let p=Math.min(100,Math.abs(v)/l*100);return card(t,`<div class="metric ${p>80?"red":"green"}">${money(v)} / ${money(l)}</div><div style="height:13px;background:rgba(255,255,255,.08);border-radius:99px"><div style="height:13px;width:${p}%;background:${p>80?"var(--red)":"var(--green)"};border-radius:99px"></div></div>`)}async function ks(action){let reason=action=="arm"?prompt("Reason?","dashboard manual trigger"):"dashboard disarm";if(action=="arm"&&!reason)return;try{await api("/api/risk/kill-switch",{method:"POST",body:JSON.stringify({action,reason})});toast(`Kill switch ${action}ed`,"green");refresh(true)}catch(e){toast(e.message,"red")}}async function sim(){try{let d=await api("/api/risk/simulate-pnl",{method:"POST",body:JSON.stringify({loss_usd:Number($("loss").value||0),weekly_loss_usd:Number($("loss").value||0)})});$("simResult").innerHTML=`<br><div class="code">${JSON.stringify(d,null,2)}</div>`;refresh(true)}catch(e){$("simResult").innerHTML=e.message}}function agents(){return title("Agents","Registry and lifecycle controls")+card("Agent Registry",`<table class="table"><thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Heartbeat</th><th>Actions</th></tr></thead><tbody>${(state.agents||[]).map(a=>`<tr><td>${a.name}</td><td>${a.agent_type}</td><td><span class="chip ${a.status=="running"?"green":a.status=="error"?"red":"blue"}"><span class="dot"></span>${a.status}</span></td><td>${ago(a.last_heartbeat)}</td><td><button class="btn" onclick="agent('${a.name}','pause')">Pause</button> <button class="btn" onclick="agent('${a.name}','resume')">Resume</button> <button class="btn red" onclick="agent('${a.name}','kill')">Kill</button></td></tr>`).join("")}</tbody></table>`)}async function agent(n,a){try{await api(`/api/agents/${n}/${a}`,{method:"POST"});refresh(true)}catch(e){toast(e.message,"red")}}function scout(){return title("Scout Network","YouTube, Reddit and Discord scout interface")+`<div class="grid three">${card("YouTube Scout",`<div class="metric green">READY</div><p class="sub">Transcript-first with yt-dlp fallback after patch</p>`)}${card("Reddit Scout",`<div class="metric blue">READY</div>`)}${card("Discord Scout",`<div class="metric amber">DEFERRED</div>`)}</div><br>${card("Test Scout",`<div class="form"><div><label>Source</label><select id="scoutSource"><option>youtube</option><option>reddit</option><option>discord</option></select></div><div><label>Query</label><input id="scoutQuery" value="anchored vwap trading strategy"></div><div><label>Max</label><input id="scoutMax" value="2"></div><button class="btn green" onclick="runScout()">Run</button></div><div id="scoutResult"></div>`)}`}async function runScout(){try{let d=await api("/api/scouts/test",{method:"POST",body:JSON.stringify({source:$("scoutSource").value,query:$("scoutQuery").value,max_results:Number($("scoutMax").value||2),limit:Number($("scoutMax").value||2)})});$("scoutResult").innerHTML=`<br>${(d.hypotheses||[]).map(h=>card(h.source_url||h.source,`<p>${h.description||""}</p><p class="sub">Confidence: ${((h.confidence||0)*100).toFixed(1)}%</p>`)).join("")||empty("No new hypotheses; duplicates may be skipped")}`}catch(e){$("scoutResult").innerHTML=`<p class="red">${e.message}</p>`}}function brief(){return title("Intelligence Brief","Market/risk/strategy report")+card("Generate Brief",`<button class="btn green" onclick="genBrief()">Generate Brief</button><div id="briefResult">${empty("Generate live intelligence brief")}</div>`)}async function genBrief(){try{let d=await api("/api/dashboard/generate-brief",{method:"POST",body:JSON.stringify({})});$("briefResult").innerHTML=`<br><div class="code">${JSON.stringify(d,null,2)}</div>`}catch(e){$("briefResult").innerHTML=`<br><div class="code">${JSON.stringify({status:"dashboard summary fallback",message:e.message,health:state.health?.status,risk:state.risk,strategies:state.strategies.length},null,2)}</div>`}}function settings(){return title("Settings","Live API configuration")+card("Configuration",`<p>API Base: <span class="mono blue">${API}</span></p><p class="sub">Auto-refresh: 10 seconds</p><p class="sub">Shortcuts: K Risk, G Strategies, R Refresh</p>`)}function renderAlerts(){$("alerts").innerHTML=(state.alerts.length?state.alerts:[{created_at:new Date(),title:"System ready",message:"Waiting for live alerts",severity:"green"}]).slice(0,8).map(a=>`<div class="alert"><b class="${a.severity=="error"?"red":"green"}">${a.title||"Alert"}</b><p class="sub">${String(a.message||a.msg||"").slice(0,150)}${String(a.message||"").length>150?"...":""}</p><small>${a.created_at?ago(a.created_at):(a.t||"now")}</small></div>`).join("")}function charts(){Object.values(state.charts).forEach(c=>c?.destroy?.());state.charts={};let mk=(id,type,data,opt={})=>{let e=$(id);if(!e)return;state.charts[id]=new Chart(e,{type,data,options:{responsive:true,plugins:{legend:{labels:{color:"#c8cfdb"}}},scales:{x:{ticks:{color:"#8c92a3"},grid:{color:"rgba(255,255,255,.04)"}},y:{ticks:{color:"#8c92a3"},grid:{color:"rgba(255,255,255,.04)"}}},...opt}})};mk("spark","line",{labels:["1","2","3","4","5"],datasets:[{data:[100,101,100.6,102,102.4],borderColor:"#00ff88",backgroundColor:"rgba(0,255,136,.12)",fill:true,tension:.4,pointRadius:0}]},{scales:{x:{display:false},y:{display:false}}});let pv=Number(state.livePortfolio?.account?.portfolio_value||100000);mk("equity","line",{labels:["-60m","-50m","-40m","-30m","-20m","-10m","now"],datasets:[{label:"Portfolio",data:[pv*.998,pv*.999,pv*.997,pv*.9995,pv*.999,pv*.9997,pv],borderColor:"#00ff88",backgroundColor:"rgba(0,255,136,.12)",fill:true,tension:.35}]});let alloc=state.livePortfolio?.asset_distribution||[];mk("assets","doughnut",{labels:alloc.length?alloc.map(x=>x.symbol):["Cash"],datasets:[{data:alloc.length?alloc.map(x=>Number(x.value||0)):[state.livePortfolio?.account?.cash||0],backgroundColor:["#00ff88","#00aaff","#ffaa00","#ff3366","#8b5cf6","#22c55e","#06b6d4","#f97316"]}]},{scales:{}});let bars=state.marketBars||[];mk("priceChart","line",{labels:bars.map(b=>new Date(b.timestamp).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})),datasets:[{label:state.selectedSymbol+" Price",data:bars.map(b=>Number(b.close)),borderColor:"#00aaff",backgroundColor:"rgba(0,170,255,.08)",fill:true,tension:.25}]});if(state.lastBacktest){let bt=state.lastBacktest.results?.backtest?.equity_curve||[],mc=state.lastBacktest.results?.monte_carlo?.equity_curve||[];mk("btChart","line",{labels:[...bt,...mc].map(x=>x.t).slice(-220),datasets:[{label:"Backtest 70%",data:bt.map(x=>x.v).slice(-220),borderColor:"#00ff88"},{label:"Monte Carlo 30%",data:mc.map(x=>x.v).slice(-220),borderColor:"#ffaa00"}]})}}document.addEventListener("keydown",e=>{let k=e.key.toLowerCase();if(k=="r")refresh();if(k=="k")page("risk");if(k=="g")page("strategies")});init();
</script>
