[tool.pytest.ini_options]
testpaths      = ["tests"]
asyncio_mode   = "auto"
log_cli        = true
log_cli_level  = "INFO"

[tool.black]
line-length    = 99
target-version = ["py311"]

[tool.ruff]
line-length = 99
select      = ["E", "F", "W", "I", "UP"]
ignore      = ["E501"]

[tool.mypy]
python_version         = "3.11"
ignore_missing_imports = true
strict                 = false
